<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - BMI Calculator</title>
</head>
<body>

    <h1>Calculate your Body Mass Index (BMI)!</h1>
    
    <fieldset> 
        Weight (in kilograms): <input type="text" id="weight" value="70" /><br /> 
        Height (in meters): <input type="text" id="height" value="1.75" /><br /> 
        <button onclick="calculate();">Get BMI!</button> 
    </fieldset> 
    
    <p> 
        Your BMI is <span id="score"></span>. <br /> 
        Your body type is <span id="type"></span>. 
    </p>

    <script>
        function calculate() {
            var height = parseFloat(document.getElementById("height").value);
            var weight = parseFloat(document.getElementById("weight").value);

            var bmi = weight / (height * height);
            document.getElementById("score").innerHTML = bmi.toFixed(2);

            var type = "";
            if (bmi < 18) {
                type = "Underweight";
            } else if (bmi >= 18 && bmi <= 25) {
                type = "Normal";
            } else if (bmi > 25 && bmi <= 30) {
                type = "Overweight";
            } else {
                type = "Obese";
            }

            document.getElementById("type").innerHTML = type;
        }

        // Run default on load
        calculate();
    </script>
</body>
</html>
