<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Timers</h1>
<h2>The setTimeout() Method</h2>
<p>Calling setTimeout() does not pause JavaScript.</p>
<p id="demo"></p>
<script>
myDisplayer("Start");
setTimeout(function() {
  myDisplayer("Timer");
}, 3000);
myDisplayer("End");
// Function to display any text
function myDisplayer(text) {
  let demo = document.getElementById("demo"); 
  demo.innerHTML += text + "<br>";
}
</script>
</body>
</html>
