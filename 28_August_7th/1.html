<!DOCTYPE html>
<html>
<head>
    <title>setTimeout Example</title>
</head>
<body>
    <button onclick="showMessage()">
        Click Me
    </button>
    <p id="message"></p>
    <script>
        function showMessage() {
            setTimeout(function() {
                document.getElementById("message").innerText = "Hello! This message appeared after 3 seconds.";
            }, 3000);
        }
    </script>
</body>
</html>
