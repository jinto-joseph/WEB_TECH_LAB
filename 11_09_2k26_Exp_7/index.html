<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 7 — Working with jQuery Hub</title>
    <style>
        :root {
            --primary: #0284c7;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            padding: 0 4px 6px 4px;
            border-bottom: 1px solid var(--border);
        }

        .exercise-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 12px 14px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .exercise-btn:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }

        .exercise-btn.active {
            border-color: #38bdf8;
            background: #0284c7;
            color: white;
        }

        .stage {
            display: flex;
            flex-direction: column;
            padding: 16px;
            height: 100%;
            background-color: #0b1120;
            gap: 8px;
        }

        .stage-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .open-tab-btn {
            color: #38bdf8;
            text-decoration: none;
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        .open-tab-btn:hover {
            background: #334155;
            color: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Experiment 7 — Working with jQuery</h1>
        <div class="header-links">
            <a href="../index.html" class="back-link">← Back to Record Portal</a>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="sidebar-title">Lab Exercises</div>
            <button class="exercise-btn active" onclick="loadPage('question1.html', this)">
                <span>Q1: Budget Calculator</span>
                <span>→</span>
            </button>
            <button class="exercise-btn" onclick="loadPage('question2.html', this)">
                <span>Q2: Cake Shop Order</span>
                <span>→</span>
            </button>
            <button class="exercise-btn" onclick="loadPage('question3.html', this)">
                <span>Q3: Car Workshop</span>
                <span>→</span>
            </button>
        </aside>

        <main class="stage">
            <div class="stage-bar">
                <span id="currentTitle">Preview: question1.html</span>
                <a id="externalLink" href="./question1.html" target="_blank" class="open-tab-btn">Open in New Window ↗</a>
            </div>
            <iframe id="previewFrame" src="./question1.html"></iframe>
        </main>
    </div>

    <script>
        function loadPage(file, btn) {
            document.querySelectorAll('.exercise-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('previewFrame').src = './' + file;
            document.getElementById('currentTitle').innerText = 'Preview: ' + file;
            document.getElementById('externalLink').href = './' + file;
        }
    </script>
</body>
</html>
