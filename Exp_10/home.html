
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: #f2f5f9;
        }

        h1 {
            text-align: center;
            color: #234;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .field {
            margin-bottom: 16px;
        }

        label, legend {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        fieldset {
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .option {
            display: inline-block;
            margin: 6px 12px 6px 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>User Registration Form</h1>

    <form action="/server" method="POST" id="registrationForm">
        <div class="field">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name"
                   placeholder="John David"
                   minlength="2" maxlength="80" required>
        </div>

        <div class="field">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password"
                   minlength="8" maxlength="128" required>
        </div>

        <div class="field">
            <label for="age">Age *</label>
            <input type="number" id="age" name="age"
                   min="1" max="120" required>
        </div>

        <div class="field">
            <label for="mobile">Mobile Number *</label>
            <input type="tel" id="mobile" name="mobile"
                   pattern="[0-9]{10}" maxlength="10"
                   placeholder="9923457891"
                   title="Enter a 10-digit mobile number" required>
        </div>

        <div class="field">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                   placeholder="johndavid@gmail.com" required>
        </div>

        <fieldset>
            <legend>Gender *</legend>
            <label class="option">
                <input type="radio" name="gender" value="Male" required>
                Male
            </label>
            <label class="option">
                <input type="radio" name="gender" value="Female">
                Female
            </label>
        </fieldset>

        <div class="field">
            <label for="state">State *</label>
            <select id="state" name="state" required>
                <option value="">-- Select State --</option>
                <option value="Kerala">Kerala</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Telangana">Telangana</option>
                <option value="Maharashtra">Maharashtra</option>
            </select>
        </div>

        <fieldset>
            <legend>Skills * (select at least one)</legend>
            <label class="option">
                <input type="checkbox" name="skills" value="Java Script">
                Java Script
            </label>
            <label class="option">
                <input type="checkbox" name="skills" value="Python">
                Python
            </label>
            <label class="option">
                <input type="checkbox" name="skills" value="C++">
                C++
            </label>
            <label class="option">
                <input type="checkbox" name="skills" value="Java">
                Java
            </label>
        </fieldset>

        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function (event) {
                const skills = document.querySelectorAll(
                    'input[name="skills"]:checked'
                );

                if (skills.length === 0) {
                    event.preventDefault();
                    alert("Please select at least one skill.");
                }
            });
    </script>
</body>
</html>
